{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- BREADCRUMB AREA START -->
<div class="ltn__breadcrumb-area text-left bg-overlay-white-30 bg-image " data-bs-bg="{% static 'img/bg/14.jpg' %}">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="ltn__breadcrumb-inner">
                    <h1 class="page-title">تکمیل حساب کاربری</h1>
                    <div class="ltn__breadcrumb-list">
                        <ul>
                            <li><a href="{% url 'home:index' %}"><span class="ltn__secondary-color"><i
                                            class="fas fa-home"></i></span> خانه</a></li>
                            <li>تکمیل حساب کاربری</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- BREADCRUMB AREA END -->

<!-- LOGIN AREA START (Register) -->
<div class="ltn__login-area pb-110">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="section-title-area text-center">
                    <h1 class="section-title">تکمیل حساب کاربری</h1>
                    <p>ثبت نام خود را تکمیل کنید</p>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-6 offset-lg-3">
                <div class="account-login-inner">
                    <form action="{% url 'nurse_users:register_setpass' %}" class="ltn__form-box contact-form-box" enctype="multipart/form-data" method="post" autocomplete="off">
                        {% csrf_token %}
                        <input type="password" name="password" placeholder="رمز">
                        <input type="password" name="confirtm_password" placeholder="تایید رمز">
                        <br><br>
                        <label for="picture">گواهی تایید کلینیک یا پرستار (برای دانشجویان کارت دانشجویی)(کمتر از ۵ مگابایت)</label>
                        <input name="ministry_proof_picture" type="file" name="picture" accept="image/*" required>
                        <br><br>
                        <label for="picture">عکس پروفایل (کمتر از ۵ مگابایت)</label>
                        <input type="file" name="profile_picture" accept="image/*" required>
                        <br><br>
                        <label for="identity_card_picture">عکس کارت شناسایی شخص ثبت نام کننده(کارت ملی یا شناسنامه) (کمتر از ۵ مگابایت)</label>
                        <input type="file" name="identity_card_picture" accept="image/*" required>
                        <br><br>
                        <div class="btn-wrapper">
                            <button class="theme-btn-1 btn reverse-color btn-block" type="submit">ارسال
                                </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- LOGIN AREA END -->

{% endblock %}
